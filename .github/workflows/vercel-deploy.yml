name: Deploy to Vercel (Production)

# Deploys with the Vercel owner's token, so commits from any author
# are not blocked by the Hobby plan's collaboration limit.
env:
  VERCEL_ORG_ID: team_95zezyFaAGmd5ac21fYLpjvl
  VERCEL_PROJECT_ID: prj_Z79Ox0rXZoG0M5regFFFSMQWY4GN

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
